name: Build and deploy devlog

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/_drafts/**'
  workflow_dispatch:
    inputs:
      compact_image_history:
        description: Compact converted image history; resync local clones afterwards
        type: boolean
        default: false
  workflow_run:
    workflows: ['Build Intake Page']
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: devlog-pages
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record the checked-out source revision
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: main
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-fieldlog.txt
      - name: Install publishing dependencies
        run: python -m pip install -r scripts/requirements-fieldlog.txt
      - name: Verify shared contract copies
        run: |
          cmp scripts/site_post_metadata.py .metadata-spec/tools/site_post_metadata.py
          cmp scripts/media_naming.py .metadata-spec/tools/media_naming.py
          cmp schemas/content-metadata.schema.json .metadata-spec/content/content-metadata.schema.json
          cmp schemas/site-post.schema.json .metadata-spec/content/site-post.schema.json
      - name: Normalize saved post metadata
        run: python scripts/site_post_metadata.py normalize --site fieldlog --root natsci/fieldlog --schema-dir schemas
      - name: Normalize saved photos to WebP
        run: python scripts/normalize_fieldlog_images.py
      - name: Test content and publishing behavior
        run: |
          python -m unittest discover -s scripts -p 'test_post_indexes.py' -v
          python -m unittest discover -s scripts -p 'test_translation_pages.py' -v
          python -m unittest discover -s scripts -p 'test_fieldlog*.py' -v
          python -m unittest discover -s tests -p 'test_fieldlog*.py' -v
          python -m unittest discover -s tests -p 'test_metadata.py' -v
      - name: Import committed image uploads
        run: python scripts/import_fieldlog_triggers.py
      - name: Validate the shared post profile
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site fieldlog --content-root natsci/fieldlog --root . --schema .metadata-spec/content/content-metadata.schema.json
      - name: Update note directories
        run: python scripts/update_module_indexes.py
      - name: Check translation source blocks and image exclusions
        run: python scripts/check_translation_pages.py
      - name: Validate publication media and metadata
        run: |
          python scripts/media_naming.py check --site fieldlog --root natsci/fieldlog
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the existing note website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ steps.source.outputs.commit }}
      - name: Build Fieldlog into the website artifact
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          python scripts/build_fieldlog.py
          python scripts/build_fieldlog.py --check
          python scripts/check_devlog_site.py
      - name: Save content, directories, and upload cursor together
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during generation. No content was pushed; rerun against the latest main.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- natsci/fieldlog posts/index.md posts/ai-discourse-analysis/index.md natsci/index.md netcom/index.md
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Normalize metadata, update directories, and import Fieldlog'
            git push origin HEAD:main
          fi
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        name: Deploy website
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public Fieldlog pages and images
        run: python scripts/verify_fieldlog_live.py
      - name: Verify public note entrypoints
        run: python scripts/check_devlog_site.py --url https://devlog.fivsevn.com
      - name: Clear only verified image uploads
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'A newer commit arrived. Inbox retained; the next queued run will continue.'
            exit 1
          fi
          python scripts/fieldlog_image_inbox.py
          git add -- natsci/fieldlog/.publishing
          git add -u -- natsci/fieldlog/trigger_imgs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Record verified Fieldlog deployment and clear image inbox'
            git push origin HEAD:main
          fi
      - name: Prepare verified image history cleanup
        id: media_history
        if: github.event_name == 'workflow_dispatch' && inputs.compact_image_history == true
        run: |
          python -m pip install git-filter-repo==2.47.0
          python scripts/compact_media_history.py --prepare --scope devlog --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/webp-history" --defer-if-pending > "$RUNNER_TEMP/webp-history-result.json"
          python - <<'PY_HISTORY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'webp-history/report.json').read_text())
          ready = report['status'] == 'prepared'
          if ready:
              assert report['protected_files_equal'] and report['cursor_ancestors_verified']
              assert report['remaining_target_paths'] == 0 and report['backup']['verified']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Image history cleanup:', report['status'], report.get('reason', ''), 'paths:', report.get('filtered_path_count', 0))
          PY_HISTORY
      - name: Push compacted history without overwriting newer work
        if: steps.media_history.outputs.ready == 'true'
        run: python scripts/compact_media_history.py --push --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/webp-history" --defer-if-pending
      - name: Retain the image history cleanup report
        if: always() && steps.media_history.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: image-history-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/webp-history/report.json
            ${{ runner.temp }}/webp-history/filtered-paths.json
            ${{ runner.temp }}/webp-history/commit-map.json
            ${{ runner.temp }}/webp-history/filter-repo.log
            ${{ runner.temp }}/webp-history/push.log
          if-no-files-found: ignore
          retention-days: 1
