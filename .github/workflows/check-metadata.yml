name: Check document metadata
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - scripts/apply_draft_frontmatter.py
      - scripts/update_module_indexes.py
      - tests/test_metadata.py
      - .github/workflows/check-metadata.yml
  pull_request:
    paths:
      - '**/*.md'
      - scripts/apply_draft_frontmatter.py
      - scripts/update_module_indexes.py
      - tests/test_metadata.py
      - .github/workflows/check-metadata.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: main
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml jsonschema
      - run: python -m unittest discover -s tests -p 'test_metadata.py' -v
      - name: Read-only shared schema check
        run: python .metadata-spec/tools/check_metadata.py --repo devlog --root . --schema .metadata-spec/content/content-metadata.schema.json --references .metadata-spec
      - name: Read-only shared post-package check
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site fieldlog --content-root natsci/fieldlog --root . --schema .metadata-spec/content/content-metadata.schema.json

  cleanup-retired-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete the two retired workflow histories
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const targets = [
              {id: 382754059, name: 'Read-only metadata and repository audit', path: '.github/workflows/audit-metadata-readonly.yml', runs: [38337835930]},
              {id: 382787508, name: 'Prepare reviewed content metadata', path: '.github/workflows/metadata-prepare.yml', runs: [38342883176, 38342584781, 38342378811]}
            ];
            const deletions = [];
            for (const target of targets) {
              const {data: workflow} = await github.rest.actions.getWorkflow({owner, repo, workflow_id: target.id});
              if (workflow.name !== target.name || workflow.path !== target.path || workflow.state !== 'disabled_manually') {
                throw new Error('Retired workflow identity or disabled state changed: ' + target.name);
              }
              try {
                await github.rest.repos.getContent({owner, repo, path: target.path, ref: 'main'});
                throw new Error('Workflow still has an active source file: ' + target.path);
              } catch (error) { if (error.status !== 404) throw error; }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id: target.id, per_page: 100});
              if (runs.some(run => run.workflow_id !== target.id || !target.runs.includes(run.id) || run.status !== 'completed')) {
                throw new Error('Unexpected or active run found; no histories deleted');
              }
              deletions.push(...runs.map(run => ({run_id: run.id, workflow_id: target.id})));
            }
            for (const run of deletions) {
              await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.run_id});
              core.info('Deleted retired workflow run ' + run.run_id);
            }
            for (const target of targets) {
              try {
                const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: target.id, per_page: 1});
                if (data.total_count !== 0) throw new Error('Retired history remains: ' + target.name);
              } catch (error) { if (error.status !== 404) throw error; }
            }
            core.info('Verified: only the four approved retired runs were removed; both retired histories are empty.');
