name: Check document metadata
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'schemas/**'
      - 'scripts/site_post_metadata.py'
      - 'scripts/media_naming.py'
      - scripts/apply_draft_frontmatter.py
      - scripts/update_module_indexes.py
      - scripts/test_post_indexes.py
      - scripts/check_translation_pages.py
      - scripts/test_translation_pages.py
      - 'posts/**/assets/**'
      - 'natsci/**/assets/**'
      - 'netcom/**/assets/**'
      - tests/test_metadata.py
      - tests/test_web_document.py
      - scripts/web_document.py
      - scripts/prepare_document_metadata.py
      - .github/workflows/check-metadata.yml
      - .github/spec-ref
  pull_request:
    paths:
      - '**/*.md'
      - 'schemas/**'
      - 'scripts/site_post_metadata.py'
      - 'scripts/media_naming.py'
      - scripts/apply_draft_frontmatter.py
      - scripts/update_module_indexes.py
      - scripts/test_post_indexes.py
      - scripts/check_translation_pages.py
      - scripts/test_translation_pages.py
      - 'posts/**/assets/**'
      - 'natsci/**/assets/**'
      - 'netcom/**/assets/**'
      - tests/test_metadata.py
      - tests/test_web_document.py
      - scripts/web_document.py
      - scripts/prepare_document_metadata.py
      - .github/workflows/check-metadata.yml
      - .github/spec-ref
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Keep the Spec pin with the checked-out source and local contract copies.
      - name: Read pinned Spec revision
        id: spec_version
        shell: bash
        run: |
          spec_ref="$(cat .github/spec-ref)"
          if [[ ! "$spec_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/spec-ref must contain one full Spec commit SHA"
            exit 1
          fi
          echo "ref=$spec_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: ${{ steps.spec_version.outputs.ref }}
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 referencing==0.37.0
      - run: python -m unittest discover -s scripts -p 'test_post_indexes.py' -v
      - run: python -m unittest discover -s scripts -p 'test_translation_pages.py' -v
      - name: Check translation source blocks and image exclusions
        run: python scripts/check_translation_pages.py
      - run: python -m unittest discover -s tests -p 'test_metadata.py' -v
      - run: python -m unittest discover -s tests -p 'test_web_document.py' -v
      - name: Read-only shared schema check
        run: python .metadata-spec/tools/check_metadata.py --repo devlog --root . --schema .metadata-spec/content/content-metadata.schema.json --references .metadata-spec
      - name: Read-only shared post-package check
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site fieldlog --content-root natsci/fieldlog --root . --schema .metadata-spec/content/content-metadata.schema.json
