name: Publish fieldlog

on:
  push:
    branches: [main]
    paths:
      - 'natsci/fieldlog/**'
      - 'scripts/*fieldlog*'
      - 'scripts/fieldlog_templates/**'
      - 'tests/test_fieldlog*.py'
      - '.github/workflows/publish-fieldlog.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fieldlog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-fieldlog.txt
      - run: python -m pip install -r scripts/requirements-fieldlog.txt
      - name: Verify upload history, generated pages, and draft preservation
        run: |
          python -m unittest discover -s scripts -p 'test_fieldlog_triggers.py' -v
          python -m unittest discover -s tests -p 'test_fieldlog*.py' -v
      - name: Save new image uploads as independent posts
        run: python scripts/import_fieldlog_triggers.py
      - name: Install original migration media once with checksum verification
        run: python scripts/restore_fieldlog_media.py
      - name: Build and validate fieldlog pages
        run: |
          python scripts/build_fieldlog.py
          python scripts/build_fieldlog.py --check
      - name: Commit content, pages, and upload cursor together
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during generation. No content was pushed; rerun against the latest main.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- natsci/fieldlog
          if ! git diff --cached --quiet; then
            git commit -m 'publish: import fieldlog images and rebuild pages'
            git push origin HEAD:main
          fi
      - name: Request the existing GitHub Pages branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A GITHUB_TOKEN bot push does not trigger another Pages build.
          # Keep the repository's existing Jekyll branch deployment intact.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
            echo '::error::Fieldlog files were saved, but GitHub rejected the Pages build request. Check Pages permissions and rerun this workflow.'
            exit 1
          fi
          echo 'Pages branch build requested. Image inbox originals are retained.' >> "$GITHUB_STEP_SUMMARY"
