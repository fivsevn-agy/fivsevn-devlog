name: Check Intake Integrity

on:
  pull_request:
    paths:
      - 'intake/**'
      - 'tests/test_intake.py'
      - 'tests/test_web_document.py'
      - 'scripts/web_document.py'
      - 'scripts/prepare_document_metadata.py'
      - '.github/workflows/*intake*'
      - '.github/workflows/build-news.yml'
  push:
    branches: [main]
    paths:
      - 'intake/**/*.py'
      - 'intake/sources.md'
      - 'intake/config.yml'
      - 'intake/requirements.txt'
      - 'tests/test_intake.py'
      - 'tests/test_web_document.py'
      - 'scripts/web_document.py'
      - 'scripts/prepare_document_metadata.py'
      - '.github/workflows/*intake*'
      - '.github/workflows/build-news.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r intake/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_intake.py' -v
      - run: python -m unittest discover -s tests -p 'test_web_document.py' -v
      - run: python intake/audit_sources.py --output intake-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intake-source-audit
          path: intake-audit.json
          retention-days: 1
