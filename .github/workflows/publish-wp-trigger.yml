name: Check flux trigger
on:
  push:
    branches: [main]
    paths:
      - 'posts/_wordpress/trigger.md'
      - 'scripts/publish_wp_text.py'
      - 'tests/test_publish_wp_text.py'
      - '.github/workflows/publish-wp-trigger.yml'
  pull_request:
    paths:
      - 'posts/_wordpress/trigger.md'
      - 'scripts/publish_wp_text.py'
      - 'tests/test_publish_wp_text.py'
      - '.github/workflows/publish-wp-trigger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown pyyaml
      - run: python -m unittest discover -s tests -p 'test_publish_wp_text.py' -v
      - run: python scripts/publish_wp_text.py --dry-run
      - name: Publication location
        run: |
          echo 'Markdown validated. flux imports main-branch trigger commits approximately every 5 minutes, then builds and deploys.' >> "$GITHUB_STEP_SUMMARY"
          echo '[Check flux publication](https://github.com/fivsevn/fivsevn-flux/actions/workflows/build.yml)' >> "$GITHUB_STEP_SUMMARY"
          echo 'WordPress is not used. Validation success is not a deployment confirmation.' >> "$GITHUB_STEP_SUMMARY"
