name: Build Intake Page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'intake/**/*.py'
      - 'intake/sources.md'
      - 'intake/config.yml'
      - 'intake/requirements.txt'
      - 'scripts/web_document.py'
      - '.github/workflows/build-news.yml'
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write

concurrency:
  group: devlog-pages
  queue: max
  cancel-in-progress: false

jobs:
  build-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r intake/requirements.txt

      - name: Check intake integrity before generating
        run: |
          python -m unittest discover -s tests -p 'test_intake.py' -v
          python -m unittest discover -s tests -p 'test_web_document.py' -v

      - name: Update daily image
        run: python intake/scripts/daily_postcard.py

      - name: Update daily species
        run: python intake/scripts/daily_field_sample.py

      - name: Update intake page
        run: python intake/build.py

      - name: Commit generated files
        run: |
          # Do not publish a page built from an obsolete source registry.
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::Branch changed during generation; rerun from the current branch head."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add intake/index.html
          git add intake/llm-context.md

          git status --short

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore(intake): update generated intake page and llm context"
            git push
          fi
